<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>jQuery</title>
    <link rel="stylesheet" href="../../common/css/reset.css">
    <link rel="stylesheet" href="../../common/css/base.css">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <div class="wrapper">
      <p class="modal-show">Click</p>
      <div class="modal" style="display: none;">
        <div class="modal-content">
          <div class="modal-text">MODAL WINDOW</div>
          <button type="button" class="modal-close">x</button>
        </div>
      </div>
    </div>
    <script src="../../common/js/jquery.js"></script>
    <script>
      // 今回やるのはモーダルです。
      // .modal-show をクリックすることで .modal をfadeInさせる。
      $('.modal-show').click(function(){
        $('.modal').fadeIn(3000);
      });
      // .modal-close をクリックで .modal をfadeOutさせる。
      $('.modal-close').click(function(){
        $('.modal').fadeOut(3000);
      });
      // .click() クリック時のイベントを登録する。
      $(document).on('click', function(event) {
        let x = event.pageX;
        let y = event.pageY;

        const $circle = $('<div></div>');

        $circle.css({
          position: 'absolute',
          top: y - 5 + 'px',
          left: x - 5 + 'px',
          width: '10px',
          height: '10px',
          backgroundColor: '#ffcccc',
          borderRadius: '50%',
          pointerEvents: 'none',
          zIndex: 1000
        });

        $('body').append($circle);

        setTimeout(() => {
          $circle.fadeOut(500, () => {
            $circle.remove();
          });
        }, 100);
      });
      // .fadeIn() 一定時間かけてフェードインする。
      // .fadeOut() 一定時間かけてフェードアウトする。
    </script>
  </body>
</html>
